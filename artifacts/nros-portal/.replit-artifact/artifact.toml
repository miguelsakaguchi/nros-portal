kind = "web"
previewPath = "/"
title = "NROS — Gestão Psicossocial"
description = "Portal web para gestão de riscos psicossociais: visão executiva, avaliação anônima, insights contextualizados e planos de ação para equipes de SST e RH."
version = "1.0.0"
id = "artifacts/nros-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19175

[services.development]
run = "pnpm --filter @workspace/nros-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nros-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/nros-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19175"
BASE_PATH = "/"
